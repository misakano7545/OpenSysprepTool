name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# 同一分支只保留最新一次运行：新推送会取消同分支上仍在跑/排队的旧运行。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        # 宪章 §12：M2–M4 只做 x64；M5 起加 x86，因为 osptd.exe 是唯一在
        # 目标系统上运行的产物，而目标系统可能是 32 位 Win7 SP1。
        # 注意 -A 的取值：x86 在生成器里叫 Win32。
        include:
          - arch: x64
            cmake_arch: x64
          - arch: x86
            cmake_arch: Win32

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A ${{ matrix.cmake_arch }}

      - name: Build
        run: cmake --build build --config Release --parallel

      # 失败时把断言原文以 annotation 形式抛出：仓库匿名访问也能看到，
      # 不必登录即可定位是哪一条 CHECK 挂了。
      - name: Test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          ctest --test-dir build -C Release --output-on-failure 2>&1 |
            Tee-Object -FilePath ctest.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Write-Host "ctest exit code: $code"
            Get-Content ctest.log | Select-String -Pattern 'TEST CASE|ERROR|FAILED|CHECK|values:|unexpected' |
              ForEach-Object { Write-Host "::error::$($_.Line.Trim())" }
            exit $code
          }
          exit 0

      - name: Selftest
        run: .\build\bin\Release\ospt.exe --selftest

      - name: Version
        run: .\build\bin\Release\ospt.exe --version

      # M3 增量（宪章 §9.7）：用固定 fixture 生成 unattend.xml，再按离线参考校验。
      # 失败时把校验脚本的 FAIL 行打成 annotation，匿名访问也能定位。
      # 注意：不要给原生命令加 2>&1 —— PowerShell 5.1 会把 stderr 变成 ErrorRecord，
      # 配合 Stop 会误杀；退出码一律显式判断。
      - name: Unattend 校验
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $work = 'build\m3'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          Copy-Item 'tests\integration\fixtures\m3_cfg.json' (Join-Path $work 'cfg.json') -Force

          Write-Host "python: $(python --version)"

          & '.\build\bin\Release\ospt.exe' --gen-unattend (Join-Path $work 'cfg.json') --out (Join-Path $work 'unattend.xml')
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::--gen-unattend 退出码 $LASTEXITCODE"
            exit $LASTEXITCODE
          }

          $xml = Join-Path $work 'unattend.xml'
          Write-Host "unattend.xml bytes: $((Get-Item -LiteralPath $xml).Length)"

          python tests\integration\verify_unattend.py $xml | Tee-Object -FilePath unattend-verify.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Get-Content unattend-verify.log |
              Select-String -Pattern 'FAIL|RESULT|Traceback' |
              ForEach-Object { Write-Host "::error::$($_.Line.Trim())" }
            exit $code
          }
          exit 0

      # M4 增量（宪章 §9.7）：生成运行计划并校验两条路径 —— 计划内嵌驱动器表，
      # 以及 --drives 显式覆盖。不依赖 runner 的实际盘符。
      - name: Runplan 校验
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $work = 'build\m4'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          Copy-Item 'tests\integration\fixtures\m4_plan.json' (Join-Path $work 'plan.json') -Force

          # 宪章 M4 的字面 gate：不带 --drives，驱动器表由计划文件携带
          & '.\build\bin\Release\ospt.exe' --gen-runplan (Join-Path $work 'plan.json') --out (Join-Path $work 'run')
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::--gen-runplan 退出码 $LASTEXITCODE"
            exit $LASTEXITCODE
          }

          python tests\integration\verify_runplan.py (Join-Path $work 'plan.json') (Join-Path $work 'run') | Tee-Object -FilePath runplan-verify.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Get-Content runplan-verify.log | Select-String -Pattern 'FAIL|RESULT|Traceback' |
              ForEach-Object { Write-Host "::error::$($_.Line.Trim())" }
            exit $code
          }

          # --drives 覆盖路径
          & '.\build\bin\Release\ospt.exe' --gen-runplan (Join-Path $work 'plan.json') --out (Join-Path $work 'run-drives') --drives 'tests\integration\fixtures\m4_drives.json'
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::--gen-runplan --drives 退出码 $LASTEXITCODE"
            exit $LASTEXITCODE
          }

          python tests\integration\verify_runplan.py (Join-Path $work 'plan.json') (Join-Path $work 'run-drives') | Tee-Object -FilePath runplan-verify-drives.log
          $code2 = $LASTEXITCODE
          if ($code2 -ne 0) {
            Get-Content runplan-verify-drives.log | Select-String -Pattern 'FAIL|RESULT|Traceback' |
              ForEach-Object { Write-Host "::error::$($_.Line.Trim())" }
            exit $code2
          }

          Write-Host "runplan 两条路径均通过"
          exit 0

      # M5 增量（宪章 §9.7）：部署运行时不只打印，等待策略也得真的生效。
      # 断言等待完成 / 不等待 / 超时+终止 / 超时+继续 四种结果，以及失败中止后
      # 后续任务不执行。全部用无害命令，不碰系统路径。
      - name: 部署运行时验收
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tests\integration\verify_deploy_exec.py `
            '.\build\bin\Release\ospt.exe' '.\build\bin\Release\osptd.exe' |
            Tee-Object -FilePath deploy-exec.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Get-Content deploy-exec.log | Select-String -Pattern 'FAIL|RESULT|Traceback' |
              ForEach-Object { Write-Host "::error::$($_.Line.Trim())" }
            exit $code
          }
          exit 0

      # M5 增量（宪章 §9.7）：Windows 7 兼容闸门。
      # 三道闸里，第 1 道（WINVER 拦 Win8+ API）在编译期已经生效；这里查第 2、3 道，
      # 并把产物自己的 --win7-compat 自述与 PE 实测值交叉比对。
      # 负例步骤用来证明闸门不是橡皮章 —— 篡改产物后闸门必须失败。
      - name: Win7 兼容闸门
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $artifacts = @(
            '.\build\bin\Release\osptd.exe',
            '.\build\bin\Release\ospt.exe',
            '.\build\bin\Release\osp_unit_tests.exe'
          )

          python tests\integration\verify_win7_compat.py @artifacts |
            Tee-Object -FilePath win7-compat.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Get-Content win7-compat.log | Select-String -Pattern 'FAIL|RESULT|Traceback' |
              ForEach-Object { Write-Host "::error::$($_.Line.Trim())" }
            exit $code
          }

          python tests\integration\verify_win7_compat_negative.py '.\build\bin\Release\osptd.exe' |
            Tee-Object -FilePath win7-compat-negative.log
          $code2 = $LASTEXITCODE
          if ($code2 -ne 0) {
            Get-Content win7-compat-negative.log | Select-String -Pattern 'FAIL|RESULT|Traceback' |
              ForEach-Object { Write-Host "::error::$($_.Line.Trim())" }
            exit $code2
          }

          Write-Host "Win7 兼容闸门（${{ matrix.arch }}）通过，且负例被正确拦下"
          exit 0

      # 上传前先断言产物真实存在且非空，并把实际字节数打进日志。
      # if-no-files-found 只能证明"有文件"，证明不了"文件非空"。
      - name: Artifact 内容断言
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = @(
            'build\bin\Release\ospt.exe',
            'build\bin\Release\osptd.exe'
          )
          $failed = $false
          foreach ($rel in $expected) {
            if (-not (Test-Path -LiteralPath $rel -PathType Leaf)) {
              Write-Host "::error::缺少产物 $rel"
              $failed = $true
              continue
            }
            $item = Get-Item -LiteralPath $rel
            if ($item.Length -le 0) {
              Write-Host "::error::产物为空 $rel"
              $failed = $true
              continue
            }
            $hash = (Get-FileHash -LiteralPath $rel -Algorithm SHA256).Hash
            Write-Host ("{0} => {1} bytes ({2:N1} KB)  sha256={3}" -f $item.Name, $item.Length, ($item.Length / 1KB), $hash)
          }
          if ($failed) { exit 1 }
          Write-Host "artifact assertion OK: 2 个产物均存在且非空"

      - uses: actions/upload-artifact@v4
        with:
          name: ospt-${{ matrix.arch }}
          path: |
            build/bin/Release/ospt.exe
            build/bin/Release/osptd.exe
          if-no-files-found: error
