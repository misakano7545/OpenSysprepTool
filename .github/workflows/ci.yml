name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arch: [x64]                 # M3 起加 x86

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A ${{ matrix.arch }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Selftest
        run: .\build\bin\Release\ospt.exe --selftest

      - name: Version
        run: .\build\bin\Release\ospt.exe --version

      - uses: actions/upload-artifact@v4
        with:
          name: ospt-${{ matrix.arch }}
          path: |
            build/bin/Release/ospt.exe
            build/bin/Release/osptd.exe
          if-no-files-found: error
